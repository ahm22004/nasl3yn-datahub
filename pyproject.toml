[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasl3yn-datahub"
version = "0.1.0"
description = "Cinematic Context Platform — Nasl3yn agent for DataHub hackathon"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Ahmad Shemies", email = "shemiesahmad@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-graphql-client>=0.4",
    "mcp>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "rich>=13.7",
    "typer>=0.12",
    "tenacity>=8.3",
    "structlog>=24.1",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://nasl3yn.com"
Repository = "https://github.com/nasl3yn/nasl3yn-datahub"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true